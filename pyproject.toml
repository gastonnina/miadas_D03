[project]
name = "sicoes-rag-ai"
version = "0.1.0"
description = "Sistema de recuperacion semantica para convocatorias del SICOES."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "bibtexparser>=1.4,<2.0",
    "ipykernel>=6.29,<7.0",
    "jupyterlab>=4.2,<5.0",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-google-genai>=2.0,<3.0",
    "langchain-openai>=0.2,<0.3",
    "lxml>=5.2,<6.0",
    "matplotlib>=3.9,<4.0",
    "notebook>=7.2,<8.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pgvector>=0.3,<0.4",
    "plotly>=5.22,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyarrow>=17.0,<18.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "scikit-learn>=1.5,<2.0",
    "seaborn>=0.13,<0.14",
    "sqlalchemy>=2.0,<3.0",
    "sentence-transformers>=3.0,<4.0",
    "streamlit>=1.36,<2.0",
    "torch>=2.4,<3.0",
    "tqdm>=4.66,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
